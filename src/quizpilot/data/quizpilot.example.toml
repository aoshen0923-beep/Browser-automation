# Created by `quizpilot init` as quizpilot.toml in the folder you run quizpilot from.
# The API key can also come from the DEEPSEEK_API_KEY environment variable,
# which is safer than writing it here.

[llm]
base_url = "https://api.deepseek.com"
# Exact, lowercase model name. deepseek-flash is fastest (best for the
# 30-second individual round); deepseek-v4-pro is the larger model.
model = "deepseek-flash"
api_key = ""
timeout = 60
# Let the model look at screenshots (charts, icon-only buttons, PDF figures).
# "auto" tries it and switches off by itself if the model can't take images.
vision = "auto"

[browser]
# Chrome/Edge started by `quizpilot chrome` listens here.
cdp_url = "http://127.0.0.1:9222"
# Dedicated profile: log in to CNKI, Doubao, CNIPA etc. once, it persists.
profile_dir = "chrome-profile"
# Which browser to use. Empty = Chrome if found, otherwise Edge. Example:
# executable = 'C:\Program Files\Google\Chrome\Application\chrome.exe'
# Stick to one browser: logins saved by Edge can't be read by Chrome.
executable = ""

[kb]
path = "kb/kb.sqlite"
downloads = "downloads"

[solver]
top_k = 8
