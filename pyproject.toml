[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quizpilot"
version = "0.1.12"
description = "Local-first research co-pilot for the AI+ information literacy contest"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "httpx>=0.27",
  "playwright>=1.49",
  "pymupdf>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
quizpilot = "quizpilot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
quizpilot = ["data/*.json", "data/*.toml", "data/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
