name: windows-build

# Builds quizpilot-windows.zip (no Python needed) for teammates.
# Every push uploads it under the run's "Artifacts". To publish a release:
# Actions -> windows-build -> Run workflow -> enter a new version (v0.1.1).
# The workflow creates the release itself as a draft, attaches the zip and
# then publishes it, which also works with immutable releases.
on:
  push:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      version:
        description: "New release version, e.g. v0.1.1 (leave empty to only build)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -e ".[dev]" pyinstaller

      - name: Test
        run: python -m pytest -q

      - name: Build
        working-directory: scripts
        run: pyinstaller -y --distpath ../dist --workpath ../build quizpilot.spec

      - name: Smoke test the exe
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = Resolve-Path dist\quizpilot\quizpilot.exe
          New-Item -ItemType Directory smoke | Out-Null
          Set-Location smoke
          & $exe init
          & $exe sites --modules 11
          & $exe ingest ..\README.md
          & $exe kb --export shared.sqlite
          if (-not (Test-Path shared.sqlite)) { throw "export failed" }
          # Proves the bundled Playwright driver starts: no Chrome is running,
          # so this must fail with the friendly "Can't reach Chrome" error.
          $env:QUIZPILOT_CDP_URL = "http://127.0.0.1:9"
          $out = & $exe crawl https://example.com 2>&1 | Out-String
          if ($out -notmatch "Can't reach Chrome") { throw "unexpected crawl output: $out" }
          exit 0

      - name: Smoke test the shell launcher outside the extracted folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory lonely | Out-Null
          Copy-Item scripts\quizpilot-shell.bat lonely\
          $out = "`n" | cmd /c lonely\quizpilot-shell.bat 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $out
          if ($code -ne 1 -or $out -notmatch "Extract All") { throw "launcher did not explain the missing exe (exit $code)" }
          exit 0

      - name: Package
        shell: pwsh
        run: |
          Copy-Item scripts\quizpilot-shell.bat dist\quizpilot\
          Copy-Item README.md dist\quizpilot\
          Compress-Archive -Path dist\quizpilot -DestinationPath quizpilot-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: quizpilot-windows
          path: quizpilot-windows.zip
          retention-days: 30

      - name: Release
        if: github.event_name == 'workflow_dispatch' && inputs.version != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:VERSION -notmatch '^v\d+\.\d+\.\d+$') { throw "version must look like v0.1.1, got '$env:VERSION'" }
          gh release view $env:VERSION 2>$null
          if ($LASTEXITCODE -eq 0) { throw "$env:VERSION already exists; pick a new version number" }
          # Draft first: immutable releases only accept assets before publishing.
          gh release create $env:VERSION quizpilot-windows.zip --draft --target $env:GITHUB_SHA `
            --title "quizpilot $env:VERSION" `
            --notes "Windows build. Download quizpilot-windows.zip, unzip it and double-click quizpilot-shell.bat."
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed" }
          gh release edit $env:VERSION --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw "publishing the release failed" }
          exit 0
