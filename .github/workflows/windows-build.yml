name: windows-build

# Builds quizpilot-windows.zip (no Python needed) for teammates.
# Every push uploads it under the run's "Artifacts". To publish a release:
# Actions -> windows-build -> Run workflow -> enter a new version (v0.1.1).
# The workflow creates the release itself as a draft, attaches the zip and
# then publishes it, which also works with immutable releases.
on:
  push:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      version:
        description: "New release version, e.g. v0.1.1 (leave empty to only build)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -e ".[dev]" pyinstaller

      - name: Test
        run: python -m pytest -q

      - name: Build
        working-directory: scripts
        run: pyinstaller -y --distpath ../dist --workpath ../build quizpilot.spec

      - name: Smoke test the exe
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = Resolve-Path dist\quizpilot\quizpilot.exe
          New-Item -ItemType Directory smoke | Out-Null
          Set-Location smoke
          & $exe --version
          & $exe init
          & $exe sites --modules 11
          & $exe ingest ..\README.md
          & $exe kb --export shared.sqlite
          if (-not (Test-Path shared.sqlite)) { throw "export failed" }
          # Proves the bundled Playwright driver starts: no Chrome is running,
          # so this must fail with the friendly "Can't reach Chrome" error.
          $env:QUIZPILOT_CDP_URL = "http://127.0.0.1:9"
          $out = & $exe crawl https://example.com 2>&1 | Out-String
          if ($out -notmatch "Can't reach Chrome") { throw "unexpected crawl output: $out" }
          exit 0

      - name: Smoke test interactive ask, with and without live Chrome
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = Resolve-Path dist\quizpilot\quizpilot.exe
          Set-Location smoke
          # A dead API endpoint: each question fails fast with an error, which
          # must be reported without ending the session.
          $env:DEEPSEEK_API_KEY = "dummy"
          $env:QUIZPILOT_BASE_URL = "http://127.0.0.1:9"
          $q = "《儿童口罩技术规范》以下哪一位不是起草人？`nA、高尚荣`nB、李桂梅`nC、许伟民`nD、李建全`n`n"
          $out = ($q + $q) | & $exe ask 2>&1 | Out-String
          Write-Host $out
          if (([regex]::Matches($out, "-> single, 4 options")).Count -ne 2) { throw "interactive ask did not read both questions" }
          if ($out -notmatch "input closed") { throw "interactive ask did not exit cleanly" }

          & $exe chrome
          $ok = $false
          foreach ($i in 1..40) {
            try { Invoke-RestMethod http://127.0.0.1:9222/json/version | Out-Null; $ok = $true; break } catch { Start-Sleep -Milliseconds 500 }
          }
          if (-not $ok) { throw "quizpilot chrome did not start Chrome with remote debugging" }
          $out = $q | & $exe ask --live --budget 20 2>&1 | Out-String
          Write-Host $out
          if ($out -notmatch "-> single, 4 options") { throw "live ask did not read the question" }
          if ($out -notmatch "Searching live in Chrome") { throw "live ask did not start the browser agent" }
          if ($out -notmatch "input closed") { throw "live ask did not keep the session alive after an error" }
          Get-Process chrome -ErrorAction SilentlyContinue | Stop-Process -Force
          exit 0

      - name: Smoke test the answering page (quizpilot ui)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = Resolve-Path dist\quizpilot\quizpilot.exe
          Set-Location smoke
          $env:DEEPSEEK_API_KEY = "dummy"
          $env:QUIZPILOT_BASE_URL = "http://127.0.0.1:9"
          $p = Start-Process -FilePath $exe -ArgumentList "ui","--no-open","--no-live","--port","8799" -PassThru -NoNewWindow
          $ok = $false
          foreach ($i in 1..40) {
            try { $st = Invoke-RestMethod http://127.0.0.1:8799/api/status; $ok = $true; break } catch { Start-Sleep -Milliseconds 500 }
          }
          if (-not $ok) { throw "answering page did not start" }
          Write-Host "status: $($st | ConvertTo-Json -Compress)"
          $sites = Invoke-RestMethod http://127.0.0.1:8799/api/logins
          if ($sites.Count -lt 100) { throw "login site list missing: $($sites.Count)" }
          $html = (Invoke-WebRequest http://127.0.0.1:8799/ -UseBasicParsing).Content
          if ($html -notmatch "quizpilot") { throw "page not served" }
          $body = @{ question = "《儿童口罩技术规范》以下哪一位不是起草人？`nA、高尚荣`nB、李桂梅`nC、许伟民`nD、李建全"; round = "team"; live = $false } | ConvertTo-Json
          $job = Invoke-RestMethod -Method Post -Uri http://127.0.0.1:8799/api/ask -Body ([Text.Encoding]::UTF8.GetBytes($body)) -ContentType "application/json; charset=utf-8"
          if ($job.options -ne 4) { throw "question not parsed: $($job | ConvertTo-Json -Compress)" }
          foreach ($i in 1..60) {
            $full = Invoke-RestMethod "http://127.0.0.1:8799/api/jobs/$($job.id)"
            if ($full.status -eq "done") { break }
            Start-Sleep -Milliseconds 500
          }
          Write-Host "job: $($full | ConvertTo-Json -Compress -Depth 5)"
          if ($full.status -ne "done") { throw "job never finished" }
          if (-not $full.quick.error) { throw "expected the dead API endpoint to be reported as an error" }
          Stop-Process -Id $p.Id -Force
          exit 0

      - name: Smoke test the shell launcher outside the extracted folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory lonely | Out-Null
          Copy-Item scripts\quizpilot-shell.bat lonely\
          $out = "`n" | cmd /c lonely\quizpilot-shell.bat 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $out
          if ($code -ne 1 -or $out -notmatch "Extract All") { throw "launcher did not explain the missing exe (exit $code)" }
          exit 0

      - name: Package
        shell: pwsh
        run: |
          Copy-Item scripts\quizpilot-shell.bat dist\quizpilot\
          Copy-Item scripts\quizpilot-ui.bat dist\quizpilot\
          Copy-Item README.md dist\quizpilot\
          Compress-Archive -Path dist\quizpilot -DestinationPath quizpilot-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: quizpilot-windows
          path: quizpilot-windows.zip
          retention-days: 30

      - name: Release
        if: github.event_name == 'workflow_dispatch' && inputs.version != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:VERSION -notmatch '^v\d+\.\d+\.\d+$') { throw "version must look like v0.1.1, got '$env:VERSION'" }
          # The exe reports its version at startup; keep it in sync with the release.
          $built = (& dist\quizpilot\quizpilot.exe --version | Out-String).Trim()
          if ($built -ne "quizpilot $($env:VERSION.TrimStart('v'))") { throw "exe says '$built' but releasing $env:VERSION; bump __version__" }
          gh release view $env:VERSION 2>$null
          if ($LASTEXITCODE -eq 0) { throw "$env:VERSION already exists; pick a new version number" }
          # Draft first: immutable releases only accept assets before publishing.
          gh release create $env:VERSION quizpilot-windows.zip --draft --target $env:GITHUB_SHA `
            --title "quizpilot $env:VERSION" `
            --notes "Windows build. Download quizpilot-windows.zip, unzip it and double-click quizpilot-shell.bat."
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed" }
          gh release edit $env:VERSION --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw "publishing the release failed" }
          exit 0
